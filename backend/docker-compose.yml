services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-fpl-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLE: 1
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: new_fpl
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: change_this_jwt_secret
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "${APP_HOST_PORT:-5001}:5000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: new-fpl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: new_fpl
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: new-fpl-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mysql_data:
